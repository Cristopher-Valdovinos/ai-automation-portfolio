name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  llm-text-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-text-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-text-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
